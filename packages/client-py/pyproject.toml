[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anyroute-client"
version = "0.1.0"
description = "Receipt verification and verify-before-send for attested Anyroute providers, with an OpenAI-compatible chat call."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "cryptography>=42",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
