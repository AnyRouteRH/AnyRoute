name: release-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  # What a contributor gets from a plain `bun test`: the in-process database and no Redis. Runs beside `release`
  # (which uses real Postgres and Redis), so it adds no wall-clock time.
  in-process-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: '1.3.14' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22' }
      - run: bun install --frozen-lockfile --ignore-scripts --minimum-release-age 604800
      - run: bun test
        env: { TZ: UTC }
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16.6@sha256:557fea37a744d5f4c8faab304b0a90858b53ab119735a88c131fd19dab802f36
        env: { POSTGRES_PASSWORD: fixture-only-ci-password }
        ports: ["55432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
      redis:
        image: redis:8.0.4@sha256:a377481f6820efffb07a879de1703a0f6086e188b9aa89f5801563631166090b
        ports: ["56379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: '1.3.14' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22' }
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with: { version: 'v1.7.1' }
      - run: bun install --frozen-lockfile --ignore-scripts --minimum-release-age 604800
      - run: bun run typecheck
      - name: Docs call nothing live that GET /api/v1/status reports as off
        run: bun run docs:claims
      - name: Check operational shell syntax and the production Compose graph
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          bun scripts/compose-graph-check.ts docker-compose.yml
      # Installed before the unit tests so the off-host backup test runs real pg_dump/age.
      - name: Install encrypted recovery test tools
        run: sudo apt-get update -qq && sudo apt-get install -y age postgresql-client-16
      - name: Unit and integration tests against Postgres and Redis
        id: backend-tests
        run: bun run test:pg --coverage --coverage-reporter lcov --coverage-dir release-evidence/backend-coverage
        env: { TZ: UTC, TEST_PG_URL: 'postgres://postgres:fixture-only-ci-password@127.0.0.1:55432/postgres', TEST_REDIS_URL: 'redis://127.0.0.1:56379' }
      - name: Bind backend coverage to the checked-out revision
        if: always()
        env: { TEST_OUTCOME: '${{ steps.backend-tests.outcome }}' }
        run: |
          mkdir -p release-evidence/backend-coverage
          git rev-parse HEAD > release-evidence/backend-coverage/source-revision.txt
          echo "$TEST_OUTCOME" > release-evidence/backend-coverage/test-outcome.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: backend-coverage, path: release-evidence/backend-coverage }
      - name: Exercise encrypted backup, empty restore and reconciliation
        run: bash scripts/recovery-drill.sh
        env:
          RECOVERY_DRILL_ACK: disposable-cluster
          PGHOST: 127.0.0.1
          PGPORT: '55432'
          PGUSER: postgres
          PGPASSWORD: fixture-only-ci-password
      - run: bun run test:e2e
      - run: bun run test:contracts --no-match-path 'test/fork/*'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile && pnpm test && pnpm build && node scripts/audit-build.mjs out
        working-directory: web
      - run: docker build -t anyroute:ci .
      - run: bash scripts/container-smoke.sh
        env:
          POSTGRES_IMAGE: postgres:16.6@sha256:557fea37a744d5f4c8faab304b0a90858b53ab119735a88c131fd19dab802f36
          REDIS_IMAGE: redis:8.0.4@sha256:a377481f6820efffb07a879de1703a0f6086e188b9aa89f5801563631166090b
      - name: Build the Railway one-shot and scheduled backup images
        run: |
          docker build -f deploy/railway/grants.Dockerfile -t anyroute-grants:ci .
          docker build -f deploy/railway/backup.Dockerfile -t anyroute-backup:ci .
          docker run --rm --entrypoint sh anyroute-backup:ci -ec 'age --version && pg_dump --version && bun --version && test "$(id -un)" = postgres'
      - name: Verify operational alert rules and delivery routing
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/monitoring:/checks:ro" -w /checks prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 check rules alerts.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/monitoring:/checks:ro" -w /checks prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 test rules alerts.test.yml
          docker run --rm --entrypoint /bin/amtool -v "$PWD/monitoring:/checks:ro" -w /checks prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a check-config alertmanager.yml

      - name: Exercise production service topology and dependency failure
        run: bash scripts/production-topology-smoke.sh
        env:
          TOPOLOGY_SMOKE_ACK: disposable-docker-host
          ANYROUTE_IMAGE: anyroute:ci
          POSTGRES_IMAGE: postgres:16.6@sha256:557fea37a744d5f4c8faab304b0a90858b53ab119735a88c131fd19dab802f36
          REDIS_IMAGE: redis:8.0.4@sha256:a377481f6820efffb07a879de1703a0f6086e188b9aa89f5801563631166090b
          FOUNDRY_IMAGE: ghcr.io/foundry-rs/foundry:v1.7.1@sha256:8347b728d5d393dac1c018691b36f506d23b9dcd78341d40ea0fcb11c3a19cdd
