name: core-security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  javascript-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: '1.3.14' }
      - name: Audit all shipped JavaScript package lockfiles
        run: |
          mkdir -p release-evidence/advisories
          result=0
          for package in . sidecar relay packages/client packages/private sdks/typescript; do
            name=$(echo "$package" | tr './' '__')
            if ! (cd "$package" && bun audit --json) > "release-evidence/advisories/$name.json"; then
              result=1
            fi
          done
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: javascript-advisories, path: release-evidence/advisories }
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Install checksum-verified Gitleaks in the disposable runner directory
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks/tool.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks/tool.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks/tool.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          python3 scripts/scan-secrets.py --gitleaks "$RUNNER_TEMP/gitleaks/gitleaks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: sanitized-secret-scan, path: release-evidence/secrets.json }
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [sidecar, relay, packages/client, packages/private, sdks/typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: '1.3.14' }
      - run: bun install --frozen-lockfile --ignore-scripts --minimum-release-age 604800
      - run: bun install --frozen-lockfile --ignore-scripts --minimum-release-age 604800
        working-directory: ${{ matrix.package }}
      - id: package-tests
        run: bun run typecheck && bun run test --coverage --coverage-reporter lcov --coverage-dir "$RUNNER_TEMP/coverage"
        working-directory: ${{ matrix.package }}
      - name: Bind JavaScript coverage to the checked-out revision
        if: always()
        env: { TEST_OUTCOME: '${{ steps.package-tests.outcome }}', CORE_PACKAGE: '${{ matrix.package }}' }
        run: |
          mkdir -p "$RUNNER_TEMP/coverage"
          git rev-parse HEAD > "$RUNNER_TEMP/coverage/source-revision.txt"
          echo "$TEST_OUTCOME" > "$RUNNER_TEMP/coverage/test-outcome.txt"
          if [ "$CORE_PACKAGE" = packages/private ]; then
            echo . > "$RUNNER_TEMP/coverage/package-prefix.txt"
          else
            echo "$CORE_PACKAGE" > "$RUNNER_TEMP/coverage/package-prefix.txt"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: 'javascript-coverage-${{ strategy.job-index }}', path: '${{ runner.temp }}/coverage' }
      - name: Build shipped JavaScript packages
        run: bun run --if-present build
        working-directory: ${{ matrix.package }}
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [packages/client-py, sdks/python]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.13.13' }
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with: { version: '0.11.18' }
      - run: uv sync --locked --extra test --no-build --no-install-project
        working-directory: ${{ matrix.package }}
      - name: Audit locked Python dependencies
        run: |
          uv export --locked --extra test --no-emit-project --no-hashes --format requirements-txt -o advisory-requirements.txt > /dev/null
          uvx --python 3.13 --exclude-newer 2026-09-25T00:00:00Z --no-build --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip -r advisory-requirements.txt -f json -o advisories.json
        working-directory: ${{ matrix.package }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: 'python-advisories-${{ strategy.job-index }}', path: '${{ matrix.package }}/advisories.json' }
      - id: python-tests
        run: |
          uv run --no-sync coverage run --source=src -m pytest
          uv run --no-sync coverage json -o coverage.json
          git rev-parse HEAD > source-revision.txt
          echo success > test-outcome.txt
        env: { PYTHONPATH: src }
        working-directory: ${{ matrix.package }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: 'python-coverage-${{ strategy.job-index }}'
          path: |
            ${{ matrix.package }}/coverage.json
            ${{ matrix.package }}/source-revision.txt
            ${{ matrix.package }}/test-outcome.txt
      - run: uv build --no-sources
        working-directory: ${{ matrix.package }}
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with: { go-version: '1.26.4', cache: false }
      - name: Check reachable Go and standard-library advisories
        run: |
          GOBIN="$RUNNER_TEMP/security-tools" go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$RUNNER_TEMP/security-tools/govulncheck" -json ./... > advisories.json
        working-directory: sdks/go
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: go-advisories, path: sdks/go/advisories.json }
      - run: go test -coverprofile=coverage.out ./... && go vet ./... && git rev-parse HEAD > source-revision.txt && echo success > test-outcome.txt
        working-directory: sdks/go
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: go-coverage
          path: |
            sdks/go/coverage.out
            sdks/go/source-revision.txt
            sdks/go/test-outcome.txt
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: javascript-typescript, build: none }
          - { language: python, build: none }
          - { language: go, build: manual }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        if: matrix.language == 'go'
        with: { go-version: '1.26.4', cache: false }
      - uses: github/codeql-action/init@87ef0dc97def48aa960fbf026a2563ee9dbdb470
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build }}
          config-file: .github/codeql/core.yml
      - run: go build ./...
        if: matrix.language == 'go'
        working-directory: sdks/go
      - uses: github/codeql-action/analyze@87ef0dc97def48aa960fbf026a2563ee9dbdb470
        with:
          category: '/language:${{ matrix.language }}'
          output: release-evidence/codeql
          # The private source has no Advanced Security subscription. Keep its results
          # as artifacts; the public mirror uploads the same analyses to Code Scanning.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: 'codeql-${{ matrix.language }}', path: release-evidence/codeql }
  solidity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: '1.3.14' }
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with: { version: 'v1.7.1' }
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with: { version: '0.11.18' }
      - run: bun install --frozen-lockfile --ignore-scripts --minimum-release-age 604800
      - name: Deep stateful conservation checks
        run: |
          mkdir -p release-evidence
          set -o pipefail
          FOUNDRY_PROFILE=audit forge test --root contracts --match-test invariant_ | tee release-evidence/invariants.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: deep-invariants, path: release-evidence/invariants.log }
      - name: Slither security analysis
        run: |
          uv venv .security-tools
          uv pip install --python .security-tools/bin/python --no-build --exclude-newer 2026-09-25T00:00:00Z 'slither-analyzer==0.11.6'
          mkdir -p release-evidence
          cd contracts
          ../.security-tools/bin/slither . --exclude-dependencies --filter-paths 'lib/|node_modules/|test/|script/' --json ../release-evidence/slither.json --fail-high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: solidity-analysis, path: release-evidence/slither.json }
