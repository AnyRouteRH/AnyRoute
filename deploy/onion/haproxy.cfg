# The HTTP proxy between Tor and the router. entrypoint.sh has already checked and exported ONION_UPSTREAM_HOST,
# ONION_UPSTREAM_PORT, ONION_PROXY_SECRET and HEALTH_BIND; HAProxy reads them from the environment.
#
# There is no `log` line anywhere in this file: HAProxy writes no access log, no error log and no stats. It needs none
# of them, and a log of onion requests is a record of who asked what, which is what this service exists not to keep.

global
    maxconn 2000
    nbthread 2
    hard-stop-after 30s

defaults
    mode http
    timeout connect 5s
    timeout client 300s
    timeout server 300s
    timeout tunnel 300s
    timeout http-request 30s
    timeout http-keep-alive 60s
    timeout queue 10s
    retries 2

# DNS for the upstream is looked up again as answers expire: the router's private address changes when it is redeployed.
resolvers dns
    parse-resolv-conf
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold other 10s
    hold refused 10s
    hold nx 10s
    hold timeout 10s
    hold obsolete 10s

# What Tor hands over. Nothing here may carry a client's identity to the router, and the router must be able to tell that
# the request came from this service: the secret goes in, any client-supplied copy or address header comes out.
frontend onion
    bind 127.0.0.1:18080
    maxconn 1500
    http-request del-header x-anyroute-onion
    http-request del-header forwarded
    http-request del-header x-forwarded-for
    http-request del-header x-forwarded-host
    http-request del-header x-forwarded-proto
    http-request del-header x-forwarded-port
    http-request del-header x-real-ip
    http-request del-header true-client-ip
    http-request del-header cf-connecting-ip
    http-request del-header x-client-ip
    http-request del-header via
    http-request set-header x-anyroute-onion "${ONION_PROXY_SECRET}"
    default_backend router

backend router
    server router "${ONION_UPSTREAM_HOST}:${ONION_UPSTREAM_PORT}" resolvers dns init-addr libc,none

# The health listener answers one path with one word and is connected to nothing.
frontend health
    bind "${HEALTH_BIND}" v4v6
    maxconn 20
    timeout client 10s
    timeout http-request 5s
    http-request return status 200 content-type text/plain string ok if { path /healthz } { method GET HEAD }
    http-request return status 404 content-type text/plain string no
