[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "anyroute"
version = "0.1.0"
description = "The official Python SDK for Anyroute: an OpenRouter compatible AI router with signed receipts and privacy lanes."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Anyroute" }]
keywords = ["anyroute", "llm", "router", "openrouter", "openai", "receipts", "ed25519", "cose"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "cryptography>=42",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "anyio>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anyroute"]

[tool.hatch.build.targets.sdist]
include = ["src/anyroute", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
