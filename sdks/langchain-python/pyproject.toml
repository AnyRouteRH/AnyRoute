[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "langchain-anyroute"
version = "0.1.0"
description = "Anyroute chat and embeddings for LangChain: 350+ models behind one key, a signed receipt on every call, and attested and unlinkable lanes."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["langchain", "anyroute", "openai-compatible", "llm", "attested", "receipts"]
dependencies = [
  "langchain-openai>=0.3",
  "langchain-core>=0.3",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Repository = "https://github.com/AnyRouteRH/AnyRoute"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_anyroute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
