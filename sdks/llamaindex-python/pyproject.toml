[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "llama-index-llms-anyroute"
version = "0.1.0"
description = "Anyroute LLM for LlamaIndex: 350+ models behind one key, a signed receipt on every call, and attested and unlinkable lanes."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["llama-index", "llamaindex", "anyroute", "openai-compatible", "llm", "attested", "receipts"]
dependencies = [
  "llama-index-core>=0.12",
  "llama-index-llms-openai-like>=0.3",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Repository = "https://github.com/AnyRouteRH/AnyRoute"

[tool.hatch.build.targets.wheel]
packages = ["llama_index"]

[tool.pytest.ini_options]
testpaths = ["tests"]
