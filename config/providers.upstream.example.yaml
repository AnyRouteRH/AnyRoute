# bun scripts/seed.ts config/providers.upstream.example.yaml
# Supply UPSTREAM_API_KEY and a persistent APP_SECRET through environment injection.
# Catalogue/pricing: https://upstream.example/v1/models (refreshed by provider-registry).
providers:
  - id: upstream
    name: upstream
    base_url: https://upstream.example/v1
    api_key_env: UPSTREAM_API_KEY
    status: live
    # Conservative aggregate policy: upstream retention/training is not ruled out.
    # upstream's API requires per-request opt-in for ZDR; a catalogue badge is insufficient.
    # https://upstream.example/privacy — private/* models require a separate encryption proxy.
    data_policy: { training: true, retains_prompts: true, zdr: false }
    datacenters: []
