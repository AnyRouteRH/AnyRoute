# LiteLLM proxy config for Anyroute. Generated by scripts/gen-integrations.ts from the live catalogue.
# Run: ANYROUTE_API_KEY=sk-ar-v1-... litellm --config config.yaml
# Any other model: add an entry with model: openai/<id from GET /api/v1/models>.
# glm-5.3-attested sends X-Anyroute-Lane: attested, so the router only uses providers with a verified enclave
# and refuses (sending nothing) when none can answer.
model_list:
  - model_name: llama-3.3-70b
    litellm_params:
      model: openai/meta-llama/llama-3.3-70b-instruct
      api_base: https://api-production-70da.up.railway.app/api/v1
      api_key: os.environ/ANYROUTE_API_KEY
      input_cost_per_token: 1.055e-7
      output_cost_per_token: 3.376e-7
    model_info:
      mode: chat
      max_input_tokens: 131072
      supports_function_calling: true
      supports_vision: false
  - model_name: hermes-4-405b
    litellm_params:
      model: openai/nousresearch/hermes-4-405b
      api_base: https://api-production-70da.up.railway.app/api/v1
      api_key: os.environ/ANYROUTE_API_KEY
      input_cost_per_token: 0.000001055
      output_cost_per_token: 0.000003165
    model_info:
      mode: chat
      max_input_tokens: 131072
      supports_function_calling: false
      supports_vision: false
  - model_name: deepseek-v3.2
    litellm_params:
      model: openai/deepseek/deepseek-v3.2
      api_base: https://api-production-70da.up.railway.app/api/v1
      api_key: os.environ/ANYROUTE_API_KEY
      input_cost_per_token: 2.954e-7
      output_cost_per_token: 4.431e-7
    model_info:
      mode: chat
      max_input_tokens: 163840
      supports_function_calling: true
      supports_vision: false
  - model_name: glm-5.3-attested
    litellm_params:
      model: openai/z-ai/glm-5.3
      api_base: https://api-production-70da.up.railway.app/api/v1
      api_key: os.environ/ANYROUTE_API_KEY
      extra_headers:
        X-Anyroute-Lane: attested
      input_cost_per_token: 0.0000014
      output_cost_per_token: 0.0000044
    model_info:
      mode: chat
      max_input_tokens: 1048576
      supports_function_calling: true
      supports_vision: false
  - model_name: qwen3-vl-30b
    litellm_params:
      model: openai/qwen/qwen3-vl-30b-a3b-instruct
      api_base: https://api-production-70da.up.railway.app/api/v1
      api_key: os.environ/ANYROUTE_API_KEY
      input_cost_per_token: 1.5825e-7
      output_cost_per_token: 6.33e-7
    model_info:
      mode: chat
      max_input_tokens: 262144
      supports_function_calling: true
      supports_vision: true
  - model_name: qwen3-embedding-8b
    litellm_params:
      model: openai/qwen/qwen3-embedding-8b
      api_base: https://api-production-70da.up.railway.app/api/v1
      api_key: os.environ/ANYROUTE_API_KEY
      input_cost_per_token: 1e-8
      output_cost_per_token: 0
    model_info:
      mode: embedding
      max_input_tokens: 32768
      supports_function_calling: false
      supports_vision: false
