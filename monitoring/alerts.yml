groups:
  - name: anyroute-readiness
    rules:
      - alert: AnyRouteUnavailable
        expr: up{job="anyroute"} == 0 or absent(up{job="anyroute"})
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: AnyRoute readiness metrics cannot be reached
      - alert: AnyRouteNotReady
        expr: anyroute_ready{job="anyroute"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: AnyRoute cannot safely accept traffic
      - alert: AnyRouteDependencyFailed
        expr: anyroute_readiness_check{job="anyroute"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: AnyRoute dependency or worker readiness failed
      - alert: AnyRouteSpentRootIncomplete
        expr: anyroute_readiness_check{job="anyroute",check="root_completeness"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: Latest Credits spent root omits a funded key, overspends a key or does not reconcile; approve no root until scripts/reconcile-roots.ts passes
      - alert: AnyRouteReadinessMetricsMissing
        expr: up{job="anyroute"} == 1 unless on(job, instance) anyroute_ready{job="anyroute"}
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: AnyRoute scrape succeeded without readiness evidence
