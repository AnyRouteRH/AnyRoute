rule_files:
  - alerts.yml
evaluation_interval: 30s
tests:
  - name: healthy
    interval: 30s
    input_series:
      - series: up{job="anyroute",instance="router:8787"}
        values: 1x8
      - series: anyroute_ready{job="anyroute",instance="router:8787"}
        values: 1x8
      - series: anyroute_readiness_check{job="anyroute",instance="router:8787",check="settlement"}
        values: 1x8
    alert_rule_test:
      - eval_time: 1m
        alertname: AnyRouteUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteUnavailable
        exp_alerts: []
      - eval_time: 1m
        alertname: AnyRouteNotReady
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteNotReady
        exp_alerts: []
      - eval_time: 1m
        alertname: AnyRouteDependencyFailed
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteDependencyFailed
        exp_alerts: []
      - eval_time: 1m
        alertname: AnyRouteReadinessMetricsMissing
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteReadinessMetricsMissing
        exp_alerts: []
  - name: failed scrape
    interval: 30s
    input_series:
      - series: up{job="anyroute",instance="router:8787"}
        values: "0x8"
    alert_rule_test:
      - eval_time: 1m
        alertname: AnyRouteUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteUnavailable
        exp_alerts:
          - exp_labels:
              job: anyroute
              instance: router:8787
              severity: critical
            exp_annotations:
              summary: AnyRoute readiness metrics cannot be reached
      - eval_time: 1m
        alertname: AnyRouteNotReady
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteNotReady
        exp_alerts: []
      - eval_time: 1m
        alertname: AnyRouteDependencyFailed
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteDependencyFailed
        exp_alerts: []
      - eval_time: 1m
        alertname: AnyRouteReadinessMetricsMissing
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteReadinessMetricsMissing
        exp_alerts: []
  - name: missing target
    interval: 30s
    input_series: []
    alert_rule_test:
      - eval_time: 1m
        alertname: AnyRouteUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteUnavailable
        exp_alerts:
          - exp_labels:
              job: anyroute
              severity: critical
            exp_annotations:
              summary: AnyRoute readiness metrics cannot be reached
      - eval_time: 1m
        alertname: AnyRouteNotReady
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteNotReady
        exp_alerts: []
      - eval_time: 1m
        alertname: AnyRouteDependencyFailed
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteDependencyFailed
        exp_alerts: []
      - eval_time: 1m
        alertname: AnyRouteReadinessMetricsMissing
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteReadinessMetricsMissing
        exp_alerts: []
  - name: not ready
    interval: 30s
    input_series:
      - series: up{job="anyroute",instance="router:8787"}
        values: 1x8
      - series: anyroute_ready{job="anyroute",instance="router:8787"}
        values: "0x8"
    alert_rule_test:
      - eval_time: 1m
        alertname: AnyRouteUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteUnavailable
        exp_alerts: []
      - eval_time: 1m
        alertname: AnyRouteNotReady
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteNotReady
        exp_alerts:
          - exp_labels:
              job: anyroute
              instance: router:8787
              severity: critical
            exp_annotations:
              summary: AnyRoute cannot safely accept traffic
      - eval_time: 1m
        alertname: AnyRouteDependencyFailed
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteDependencyFailed
        exp_alerts: []
      - eval_time: 1m
        alertname: AnyRouteReadinessMetricsMissing
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteReadinessMetricsMissing
        exp_alerts: []
  - name: missing readiness payload
    interval: 30s
    input_series:
      - series: up{job="anyroute",instance="router:8787"}
        values: 1x8
    alert_rule_test:
      - eval_time: 1m
        alertname: AnyRouteUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteUnavailable
        exp_alerts: []
      - eval_time: 1m
        alertname: AnyRouteNotReady
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteNotReady
        exp_alerts: []
      - eval_time: 1m
        alertname: AnyRouteDependencyFailed
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteDependencyFailed
        exp_alerts: []
      - eval_time: 1m
        alertname: AnyRouteReadinessMetricsMissing
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteReadinessMetricsMissing
        exp_alerts:
          - exp_labels:
              job: anyroute
              instance: router:8787
              severity: critical
            exp_annotations:
              summary: AnyRoute scrape succeeded without readiness evidence
  - name: failed worker
    interval: 30s
    input_series:
      - series: up{job="anyroute",instance="router:8787"}
        values: 1x8
      - series: anyroute_ready{job="anyroute",instance="router:8787"}
        values: 1x8
      - series: anyroute_readiness_check{job="anyroute",instance="router:8787",check="settlement"}
        values: "0x8"
    alert_rule_test:
      - eval_time: 1m
        alertname: AnyRouteUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteUnavailable
        exp_alerts: []
      - eval_time: 1m
        alertname: AnyRouteNotReady
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteNotReady
        exp_alerts: []
      - eval_time: 1m
        alertname: AnyRouteDependencyFailed
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteDependencyFailed
        exp_alerts:
          - exp_labels:
              job: anyroute
              instance: router:8787
              check: settlement
              severity: critical
            exp_annotations:
              summary: AnyRoute dependency or worker readiness failed
      - eval_time: 1m
        alertname: AnyRouteReadinessMetricsMissing
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteReadinessMetricsMissing
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteBackupStale
        exp_alerts: []
  - name: stale backup
    interval: 30s
    input_series:
      - series: up{job="anyroute",instance="router:8787"}
        values: 1x8
      - series: anyroute_ready{job="anyroute",instance="router:8787"}
        values: "0x8"
      - series: anyroute_readiness_check{job="anyroute",instance="router:8787",check="database"}
        values: 1x8
      - series: anyroute_readiness_check{job="anyroute",instance="router:8787",check="backup_fresh"}
        values: "0x8"
    alert_rule_test:
      - eval_time: 1m
        alertname: AnyRouteBackupStale
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteBackupStale
        exp_alerts:
          - exp_labels:
              job: anyroute
              instance: router:8787
              check: backup_fresh
              severity: critical
            exp_annotations:
              summary: AnyRoute has no verified off-host backup inside its freshness window
      - eval_time: 3m
        alertname: AnyRouteDependencyFailed
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteUnavailable
        exp_alerts: []
  - name: fresh backup
    interval: 30s
    input_series:
      - series: up{job="anyroute",instance="router:8787"}
        values: 1x8
      - series: anyroute_ready{job="anyroute",instance="router:8787"}
        values: 1x8
      - series: anyroute_readiness_check{job="anyroute",instance="router:8787",check="backup_fresh"}
        values: 1x8
    alert_rule_test:
      - eval_time: 3m
        alertname: AnyRouteBackupStale
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteNotReady
        exp_alerts: []
      - eval_time: 3m
        alertname: AnyRouteDependencyFailed
        exp_alerts: []
  - name: chain incident drill
    interval: 30s
    input_series:
      - series: up{job="anyroute-chain",instance="127.0.0.1:9797"}
        values: 1x8
      - series: anyroute_chain_monitor_ok{job="anyroute-chain",instance="127.0.0.1:9797"}
        values: 1x8
      - series: anyroute_chain_authority_changed{job="anyroute-chain",component="credits"}
        values: 1x4 0x4
      - series: anyroute_chain_pause_changed{job="anyroute-chain",component="credits"}
        values: 1x4 0x4
      - series: anyroute_chain_outflow_over_limit{job="anyroute-chain",component="usdg"}
        values: 1x4 0x4
      - series: anyroute_chain_keeper_underfunded{job="anyroute-chain",component="keeper"}
        values: 1x4 0x4
    alert_rule_test:
      - eval_time: 2m
        alertname: AnyRouteAuthorityChanged
        exp_alerts:
          - exp_labels: {job: anyroute-chain, component: credits, severity: critical}
            exp_annotations: {summary: Contract authority changed or differs from the reviewed owner policy}
      - eval_time: 2m
        alertname: AnyRoutePauseChanged
        exp_alerts:
          - exp_labels: {job: anyroute-chain, component: credits, severity: warning}
            exp_annotations: {summary: "A contract pause policy changed; verify the incident and preserve exits"}
      - eval_time: 2m
        alertname: AnyRouteLargeOutflow
        exp_alerts:
          - exp_labels: {job: anyroute-chain, component: usdg, severity: critical}
            exp_annotations: {summary: Token outflow exceeds the reviewed observation-window threshold}
      - eval_time: 2m
        alertname: AnyRouteKeeperUnderfunded
        exp_alerts:
          - exp_labels: {job: anyroute-chain, component: keeper, severity: warning}
            exp_annotations: {summary: A chain keeper has less native gas funding than the reviewed minimum}
      - eval_time: 4m
        alertname: AnyRouteAuthorityChanged
        exp_alerts: []
      - eval_time: 4m
        alertname: AnyRouteKeeperUnderfunded
        exp_alerts: []
